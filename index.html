<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seating Chart</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Main area -->
  <div id="main">
    <!-- Side Panel -->
    <aside id="side-panel">
      <span id="chart-title" contenteditable="true" spellcheck="false">Untitled Chart</span>

      <div id="panel-divider"></div>

      <section class="panel-section panel-section-scroll">
        <div class="section-label-row">
          <span id="stat-seated" class="guest-stat-heading">0/0 guests seated</span>
          <div id="guest-search-wrap" class="hidden">
            <input type="text" id="guest-search" placeholder="Search guests…" />
            <button id="btn-search-close" class="icon-btn" title="Close search" type="button">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M1.5 1.5L10.5 10.5M10.5 1.5L1.5 10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <button id="btn-toggle-search" class="icon-btn" title="Search guests" type="button">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M9.3 9.3L13 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="btn-add-guest" class="icon-btn" title="Add guest" type="button">+</button>
        </div>
        <div id="guest-list"></div>
        <button id="btn-add-group" class="guest-group-label" type="button">
          <svg width="8" height="8" viewBox="0 0 8 8" fill="none" aria-hidden="true">
            <path d="M4 1V7M1 4H7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span>Add Group</span>
        </button>
        <div id="guest-actions">
          <button id="btn-import-guests" class="primary">Import Guests</button>
        </div>
      </section>
    </aside>

    <!-- Canvas Area -->
    <div id="canvas-wrap">
      <canvas id="main-canvas"></canvas>

      <!-- Export controls -->
      <div id="export-controls">
        <div class="popover-wrap">
          <button id="btn-versions" type="button">
            <span id="current-version-label">Version</span>
            <svg class="chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
              <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="version-menu" class="hidden">
            <div class="section-label-row">
              <h2 class="section-label">Versions</h2>
              <button id="btn-new-version" class="icon-btn" title="New version" type="button">+</button>
            </div>
            <div id="version-list"></div>
          </div>
        </div>

        <div class="popover-wrap">
          <button id="btn-export" class="primary" type="button">
            Export as .csv
            <svg class="chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
              <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="export-menu" class="hidden">
            <button id="btn-export-table">Group guests by table</button>
            <button id="btn-export-alpha">Sort guests alphabetically</button>
          </div>
        </div>
      </div>

      <!-- Zoom controls -->
      <div id="zoom-controls">
        <button id="btn-zoom-out" title="Zoom out">−</button>
        <span id="zoom-label">100%</span>
        <button id="btn-zoom-in" title="Zoom in">+</button>
      </div>

      <!-- Table add buttons -->
      <div id="table-buttons">
        <button class="table-btn" id="btn-add-circle" title="Add round table" draggable="true">
          <span class="table-btn-icon">
            <svg class="icon-base" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <circle cx="20" cy="20" r="12" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
              <circle class="seat" style="--dx:0;--dy:-1"      cx="20" cy="5"    r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:0;--dy:1"       cx="20" cy="35"   r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:-1;--dy:0"      cx="5"  cy="20"   r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:1;--dy:0"       cx="35" cy="20"   r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:-0.71;--dy:-0.71" cx="8.5"  cy="8.5"  r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:0.71;--dy:-0.71"  cx="31.5" cy="8.5"  r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:-0.71;--dy:0.71"  cx="8.5"  cy="31.5" r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:0.71;--dy:0.71"   cx="31.5" cy="31.5" r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
            </svg>
            <svg class="icon-hover" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <circle cx="20" cy="20" r="12" fill="#fff" stroke="#2563EB" stroke-width="1.5"/>
              <circle class="seat" style="--dx:0;--dy:-1"      cx="20" cy="5"    r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:0;--dy:1"       cx="20" cy="35"   r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:-1;--dy:0"      cx="5"  cy="20"   r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:1;--dy:0"       cx="35" cy="20"   r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:-0.71;--dy:-0.71" cx="8.5"  cy="8.5"  r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:0.71;--dy:-0.71"  cx="31.5" cy="8.5"  r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:-0.71;--dy:0.71"  cx="8.5"  cy="31.5" r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:0.71;--dy:0.71"   cx="31.5" cy="31.5" r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
            </svg>
          </span>
          <span>Round</span>
        </button>
        <button class="table-btn" id="btn-add-rect" title="Add rectangle table" draggable="true">
          <span class="table-btn-icon">
            <svg class="icon-base" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <rect x="4" y="13" width="32" height="14" rx="3" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
              <circle class="seat" style="--dx:-1;--dy:-1"     cx="8"  cy="8"  r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:-0.33;--dy:-1"  cx="16" cy="8"  r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:0.33;--dy:-1"   cx="24" cy="8"  r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:1;--dy:-1"      cx="32" cy="8"  r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:-1;--dy:1"      cx="8"  cy="32" r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:-0.33;--dy:1"   cx="16" cy="32" r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:0.33;--dy:1"    cx="24" cy="32" r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:1;--dy:1"       cx="32" cy="32" r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
            </svg>
            <svg class="icon-hover" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <rect x="4" y="13" width="32" height="14" rx="3" fill="#fff" stroke="#2563EB" stroke-width="1.5"/>
              <circle class="seat" style="--dx:-1;--dy:-1"     cx="8"  cy="8"  r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:-0.33;--dy:-1"  cx="16" cy="8"  r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:0.33;--dy:-1"   cx="24" cy="8"  r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:1;--dy:-1"      cx="32" cy="8"  r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:-1;--dy:1"      cx="8"  cy="32" r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:-0.33;--dy:1"   cx="16" cy="32" r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:0.33;--dy:1"    cx="24" cy="32" r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:1;--dy:1"       cx="32" cy="32" r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
            </svg>
          </span>
          <span>Rectangle</span>
        </button>
        <button class="table-btn" id="btn-add-sweetheart" title="Add sweetheart table" draggable="true">
          <span class="table-btn-icon">
            <svg class="icon-base" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <rect x="5" y="14" width="30" height="14" rx="5" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
              <circle class="seat" style="--dx:0;--dy:-1" cx="13" cy="9" r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
              <circle class="seat" style="--dx:0;--dy:-1" cx="27" cy="9" r="3.5" fill="#e0e0e0" stroke="#bbb" stroke-width="1"/>
            </svg>
            <svg class="icon-hover" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <rect x="5" y="14" width="30" height="14" rx="5" fill="#fff" stroke="#2563EB" stroke-width="1.5"/>
              <circle class="seat" style="--dx:0;--dy:-1" cx="13" cy="9" r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
              <circle class="seat" style="--dx:0;--dy:-1" cx="27" cy="9" r="3.5" fill="#DCE8FD" stroke="#6C93F5" stroke-width="1"/>
            </svg>
          </span>
          <span>Sweetheart</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <div id="modal-content"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
